# Full stack: Kafka + MLflow + scoring API + stream consumer + Prometheus + Grafana.
#
#   docker compose up -d kafka kafka-ui mlflow        # infrastructure
#   docker compose run --rm trainer                   # train all baselines -> MLflow + artifacts/champion
#   docker compose up -d api consumer prometheus grafana
#   docker compose run --rm producer                  # replay the test window as a live stream
#   docker compose run --rm retrainer                 # drift/label-triggered champion-challenger retraining
#
# UIs: API docs http://localhost:8000/docs | MLflow http://localhost:5000
#      Prometheus http://localhost:9090   | Grafana http://localhost:3000 (dashboard "Fraud Detection")
#      Kafka UI http://localhost:8080

x-app: &app
  build: .
  image: fraud-detection:latest
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    MLFLOW_TRACKING_URI: http://mlflow:5000
    API_URL: http://api:8000
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./reports:/app/reports
    # SQLite prediction store on a named volume: on Docker Desktop (Windows/macOS) a bind mount makes every
    # commit go through the host file-sharing layer (~4.5x slower inserts, the consumer falls behind).
    - store-data:/app/data/store

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:   # browse topics, messages, partitions and consumer-group lag
    image: kafbat/kafka-ui:v1.3.0
    container_name: fraud-kafka-ui
    ports: ["8080:8080"]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # internal listener (localhost:9092 is for the host)
      DYNAMIC_CONFIG_ENABLED: "false"

  mlflow:
    <<: *app
    container_name: fraud-mlflow
    ports: ["5000:5000"]
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"

  trainer:
    <<: *app
    profiles: ["jobs"]
    depends_on: [mlflow]
    command: ["python", "-m", "fraud.train"]

  api:
    <<: *app
    container_name: fraud-api
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  consumer:   # scale out with `docker compose up -d --scale consumer=3` (topics have 3 partitions)
    <<: *app
    depends_on:
      kafka: {condition: service_healthy}
      api: {condition: service_healthy}
    restart: unless-stopped
    command: ["python", "-m", "fraud.streaming.consumer"]

  producer:
    <<: *app
    profiles: ["jobs"]
    depends_on:
      kafka: {condition: service_healthy}
    command: ["python", "-m", "fraud.streaming.producer", "--rate", "300", "--label-delay", "5",
              "--drift-after", "30000", "--drift-type", "both"]

  retrainer:
    <<: *app
    profiles: ["jobs"]
    depends_on: [mlflow, api]
    command: ["python", "-m", "fraud.retrain", "--reload-url", "http://api:8000"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fraud-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fraud-grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraud.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mlflow-data:
  store-data:
